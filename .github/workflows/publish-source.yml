name: Publish reviewed skill source

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-source.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'hdyyinfiniteai-jpg/ai-film-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and restore the reviewed source package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          package = Path('skill-source-package.zip')
          expected = '352e0f16992b74071700930c41aff25b5bc4db31a77a050bb78e800832ae3df4'
          assert hashlib.sha256(package.read_bytes()).hexdigest() == expected
          root = Path.cwd().resolve()
          with zipfile.ZipFile(package) as archive:
              assert len(archive.infolist()) == 71
              for entry in archive.infolist():
                  name = Path(entry.filename)
                  target = (root / name).resolve()
                  assert target.is_relative_to(root)
                  assert not name.is_absolute()
                  assert name.parts[0] not in {'.git', '.github', 'assets'}
                  assert entry.external_attr >> 16 & 0o170000 != 0o120000
              archive.extractall(root)
          package.unlink()
          print('Restored all 71 reviewed source files; existing media preserved.')
          PY
      - name: Commit the complete skill
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish complete ai-film-studio source, modules, and examples'
          git push origin HEAD:main
